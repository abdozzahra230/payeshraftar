<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تست برنامک ایتا</title>
    <!-- فراخوانی SDK رسمی برنامک ایتا -->
    <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
    <style>
        :root {
            --bg-color: #f7f9fa;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-color: #e06d14; /* رنگ تم ایتا */
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            margin: 0 0 6px 0;
            color: var(--primary-color);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-badge.online {
            background-color: #def7ec;
            color: #03543f;
        }

        .status-badge.warning {
            background-color: #fef08a;
            color: #854d0e;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 0.95rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #64748b;
        }

        .value {
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        button:active {
            opacity: 0.8;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
        }

        .btn-secondary {
            background-color: #e2e8f0;
            color: #334155;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card header">
        <h1>پایش رفتار (برنامک ایتا)</h1>
        <div id="env-badge" class="status-badge warning">بررسی محیط اجرا...</div>
    </div>

    <div class="card">
        <h3 style="margin-top: 0; font-size: 1rem; color: #475569;">مشخصات کاربر جاری:</h3>
        <div class="info-row">
            <span class="label">نام کاربر:</span>
            <span class="value" id="user-name">نامشخص</span>
        </div>
        <div class="info-row">
            <span class="label">شناسه (ID):</span>
            <span class="value" id="user-id">---</span>
        </div>
        <div class="info-row">
            <span class="label">نام کاربری:</span>
            <span class="value" id="user-username">---</span>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-primary" onclick="testSendData()">ارسال پیام تستی به ایتا</button>
        <button class="btn-secondary" onclick="closeApp()">بستن برنامک</button>
    </div>
</div>

<script>
    // دسترسی به شیء وب‌اپلیکیشن ایتا
    const tg = window.Eitaa?.WebApp || window.Telegram?.WebApp;

    const envBadge = document.getElementById('env-badge');
    const userNameEl = document.getElementById('user-name');
    const userIdEl = document.getElementById('user-id');
    const userUsernameEl = document.getElementById('user-username');

    if (tg) {
        // ۱. اعلام آماده‌بودن برنامک به کلاینت ایتا
        tg.ready();

        // ۲. گسترش صفحه به حالت تمام‌صفحه
        tg.expand();

        envBadge.textContent = "متصل به کلاینت ایتا ✔";
        envBadge.className = "status-badge online";

        // ۳. خواندن اطلاعات کاربر از متغیر initDataUnsafe
        const user = tg.initDataUnsafe?.user;
        if (user) {
            userNameEl.textContent = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'بی‌نام';
            userIdEl.textContent = user.id || 'نامشخص';
            userUsernameEl.textContent = user.username ? `@${user.username}` : 'ندارد';
        } else {
            userNameEl.textContent = "اطلاعات ارسال نشد";
        }

        // ۴. تست فعال‌سازی دکمه پیش‌فرض بومی پایین ایتا (MainButton)
        if (tg.MainButton) {
            tg.MainButton.setText("دکمه اصلی ایتا (فعال است)");
            tg.MainButton.show();
            tg.MainButton.onClick(() => {
                tg.showAlert("روی دکمه اصلی کلاینت کلیک کردید!");
            });
        }

    } else {
        // در صورتی که خارج از ایتا در مرورگر معمولی باز شود
        envBadge.textContent = "اجرا خارج از ایتا (مرورگر عادی)";
        envBadge.className = "status-badge warning";
        userNameEl.textContent = "کاربر تستی مرورگر";
        userIdEl.textContent = "12345678";
        userUsernameEl.textContent = "@test_user";
    }

    // متد ارسال داده به بازو
    function testSendData() {
        if (tg && tg.sendData) {
            const data = {
                action: "test_ping",
                timestamp: new Date().toISOString(),
                message: "ارتباط از سمت فرانت‌اِند با موفقیت تست شد."
            };
            tg.sendData(JSON.stringify(data));
        } else {
            alert("این دستور فقط داخل پیام‌رسان ایتا کار می‌کند.");
        }
    }

    // متد بستن برنامک
    function closeApp() {
        if (tg && tg.close) {
            tg.close();
        } else {
            alert("این دستور در مرورگر معمولی کارایی ندارد.");
        }
    }
</script>

</body>
</html>
